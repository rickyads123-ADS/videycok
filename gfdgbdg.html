<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ffdd</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            cursor: pointer;
        }

        /* Capa invisible superior para detectar el primer clic */
        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: transparent;
        }
    </style>
</head>
<body>

<div class="video-container">
    <!-- Capa que detecta el clic para el Direct Link -->
    <div id="overlay" class="click-overlay"></div>
    
    <!-- Reproductor de Video -->
    <video id="myVideo" controls poster="">
        <source src="https://cdn.aceimg.com/42339a7a6.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video.
    </video>
</div>

<script>
    const video = document.getElementById('myVideo');
    const overlay = document.getElementById('overlay');
    const directLink = "https://crn77.com/4/10297259";

    // Detecta el clic en la capa invisible
    overlay.addEventListener('click', function() {
        // Abre el direct link en una nueva pestaña
        window.open(directLink, '_blank');
        
        // Remueve la capa invisible para que el usuario ya pueda usar los controles nativos del video
        overlay.style.display = 'none';
        
        // Inicia la reproducción del video
        video.play();
    });
</script>

</body>
</html>
