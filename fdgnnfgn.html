<!DOCTYPE html>

            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            cursor: pointer;
        }

        .click-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            background: transparent;
        }

        /* ESTILO PARA OCULTAR EL CONTADOR COMPLETAMENTE */
        .oculto {
            display: none !important;
            visibility: hidden !important;
            width: 0px !important;
            height: 0px !important;

            position: absolute !important;
        }
    </style>
</head>
